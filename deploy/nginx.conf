# Nginx de producción de MeDeben: sirve la PWA y proxya el API.
# Cierra el pendiente de la auditoría "cabeceras de seguridad al desplegar".
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (auditoría 2026-07-08) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: la app es autocontenida (sin CDNs); connect-src same-origin cubre
    # el API proxyado. 'unsafe-inline' solo en style-src (estilos de Vue).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'" always;

    # El API, al backend (la IP real viaja en X-Forwarded-For: el rate
    # limiting corre con medeben.rate-limit.confiar-en-proxy=true).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: cualquier ruta del router de Vue cae en el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker y el manifest no se cachean agresivamente.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Los assets con hash en el nombre sí, un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

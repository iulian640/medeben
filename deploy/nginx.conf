# Nginx de producción de MeDeben: sirve la PWA y proxya el API.
# Cierra el pendiente de la auditoría "cabeceras de seguridad al desplegar".
server {
    listen 80;
    # Fijado al dominio real (defensa en profundidad): este nginx solo escucha
    # en 127.0.0.1:80 y solo Caddy le llega, pero así no responde como servidor
    # por defecto a cualquier Host. El www→apex lo hace Caddy antes de aquí.
    server_name medeben.net;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad. OJO: nginx solo hereda add_header si el bloque
    # hijo no tiene ninguno propio; por eso el snippet se re-incluye en cada
    # location que ponga Cache-Control (si no, /assets y /sw.js saldrían sin CSP
    # ni nosniff, justo sobre el código ejecutable).
    include /etc/nginx/security-headers.conf;

    # El API, al backend. OJO con X-Forwarded-For y el rate limiting por IP:
    # RateLimitFilter.resuelveIp() lee el ÚLTIMO valor de la cabecera (con
    # confiar-en-proxy=true) para que un cliente no pueda falsear su IP. Delante
    # de este nginx va SIEMPRE Caddy (terminador TLS, único salto público), que
    # ya anexa la IP real del cliente al final de X-Forwarded-For. Por eso aquí
    # se REENVÍA tal cual ($http_x_forwarded_for), no $proxy_add_x_forwarded_for:
    # este último anexaría el peer inmediato de nginx —que es Caddy en 127.0.0.1—
    # como último valor, y entonces TODOS los clientes compartirían la cubeta de
    # 127.0.0.1 (el límite anti-fuerza-bruta dejaría de ser por IP). Caddy debe
    # quedarse con su `trusted_proxies` por defecto (vacío) para que la última
    # entrada sea siempre la IP real que él ve.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # SPA: cualquier ruta del router de Vue cae en el index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker no se cachea agresivamente (re-incluye las cabeceras).
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Los assets con hash en el nombre sí, un año (re-incluye las cabeceras).
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

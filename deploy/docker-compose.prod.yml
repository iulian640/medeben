# Producción autocontenida de MeDeben: BD + backend + web (nginx con la PWA).
# Uso: crear deploy/.env con las variables de abajo y
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medeben
      POSTGRES_USER: medeben
      POSTGRES_PASSWORD: ${MEDEBEN_DB_PASSWORD:?falta MEDEBEN_DB_PASSWORD en deploy/.env}
    volumes:
      - medeben-datos:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medeben']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Raíz del repo: el pom necesita ../convenios dentro del contexto.
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MEDEBEN_DB_URL: jdbc:postgresql://db:5432/medeben
      MEDEBEN_DB_USUARIO: medeben
      MEDEBEN_DB_PASSWORD: ${MEDEBEN_DB_PASSWORD:?falta MEDEBEN_DB_PASSWORD en deploy/.env}
      # Mínimo 32 bytes. Genera uno con: openssl rand -base64 48
      MEDEBEN_SEGURIDAD_JWT_SECRETO: ${MEDEBEN_SEGURIDAD_JWT_SECRETO:?falta MEDEBEN_SEGURIDAD_JWT_SECRETO en deploy/.env}
      # Detrás del nginx de este compose la IP real llega en X-Forwarded-For.
      MEDEBEN_CONFIAR_EN_PROXY: 'true'

  web:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # La PWA compilada: npm run build en frontend/ antes de levantar.
      - ../frontend/dist:/usr/share/nginx/html:ro

volumes:
  medeben-datos:

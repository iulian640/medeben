name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify + validador de convenios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # En los runners hay Docker: aquí SÍ corren los tests de Testcontainers
      # que en local se saltan, además del validador cruzado de la capa
      # normalizada contra las transcripciones. verify (no test) para que
      # JaCoCo genere el informe y aplique el gate de líneas.
      - name: Tests y cobertura
        working-directory: backend
        run: mvn -B --no-transfer-progress verify
      - name: Subir informe de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      - name: Subir surefire-reports (solo si fallan los tests)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests y cobertura
        run: npm run test:coverage
      - name: Subir informe de cobertura (vitest)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
      - name: Build
        run: npm run build

# Local development: PostgreSQL 16 from the docker-compose.yml at the repo root.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/medeben
    username: medeben
    password: medeben

# Secreto JWT SOLO PARA DESARROLLO LOCAL (jamás en producción: allí viene de
# la variable de entorno MEDEBEN_SEGURIDAD_JWT_SECRETO).
medeben:
  seguridad:
    jwt:
      secreto: "secreto-de-desarrollo-no-usar-en-produccion-32-bytes!"
  rate-limit:
    # El rate limiting es una defensa de PRODUCCIÓN. En dev estorba: el E2E de
    # Playwright registra ~10 cuentas seguidas desde la misma IP y el presupuesto
    # estricto de /auth/registro (5 de ráfaga, 2/min) lo ahoga con 429. El propio
    # limitador ya se prueba aparte en RateLimitFilterRegistroTest, así que
    # apagarlo aquí no baja cobertura. En prod sigue activo (application-prod.yml).
    habilitado: false

spring:
  application:
    name: tedeben-backend
  profiles:
    default: dev
  mvc:
    problemdetails:
      # Errores del framework (JSON malformado, parametro ausente...) tambien
      # como RFC 7807, igual que los del GlobalExceptionHandler
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

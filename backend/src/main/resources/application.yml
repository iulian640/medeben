spring:
  application:
    name: medeben-backend
  profiles:
    default: dev
  mvc:
    problemdetails:
      # Errores del framework (JSON malformado, parametro ausente...) tambien
      # como RFC 7807, igual que los del GlobalExceptionHandler
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

medeben:
  rate-limit:
    # Presupuestos por defecto (producción). Ver RateLimitProperties.
    habilitado: true
    # Sin proxy de confianza delante NO se debe activar (anti IP-spoofing).
    confiar-en-proxy: false
    auth:
      # /api/v1/auth/** (login, logout): por IP, anti fuerza bruta. La ráfaga
      # debe absorber una plantilla entera tras el mismo WiFi/CGNAT haciendo
      # login casi a la vez al empezar el turno.
      capacidad: 30
      recarga-por-minuto: 20
    registro:
      # /auth/registro (hallazgo de auditoría): el 409 de email duplicado
      # frente al 201 permite enumerar cuentas por fuerza bruta. Presupuesto
      # PROPIO y mucho más estrecho que el de auth — registrarse es un evento
      # raro por IP, no necesita absorber una plantilla entera como el login.
      capacidad: 5
      recarga-por-minuto: 2
    registro-global:
      # /auth/registro, bucket GLOBAL compartido por TODAS las IPs (second
      # review): el bucket por IP no frena la enumeracion distribuida (mil
      # IPs, un email cada una); este acota el total del sistema. Trade-off
      # asumido: agotarlo devuelve 429 tambien a registros legitimos un rato.
      # Rafaga 30 + 60/hora, muy por encima del volumen real de la app.
      capacidad: 30
      recarga-por-minuto: 1
    refresh:
      # /auth/refresh (B4): con el access de 15 min, cada usuario activo
      # refresca ~4 veces/hora durante TODO el turno, y la clave es la IP
      # compartida — en el bucket estricto de auth, la plantilla se
      # auto-bloquearía el login. La fuerza bruta no es la amenaza (256 bits):
      # esto solo frena abuso volumétrico. ~100 usuarios/IP × 4/h ≈ 7/min.
      capacidad: 60
      recarga-por-minuto: 40
    api:
      # Resto de /api/**: por usuario autenticado (o IP si no hay JWT).
      capacidad: 40
      recarga-por-minuto: 120
    informes:
      # /api/v1/informes/**: generar un PDF recorre el año y maqueta el
      # documento — mucho más caro que un GET. Presupuesto propio y estrecho
      # (nadie legítimo baja más de un puñado de informes seguidos).
      capacidad: 5
      recarga-por-minuto: 3

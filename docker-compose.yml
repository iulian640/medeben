# Local development only: PostgreSQL for the backend (profile dev).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: medeben-postgres
    environment:
      POSTGRES_DB: medeben
      POSTGRES_USER: medeben
      POSTGRES_PASSWORD: medeben
    ports:
      - "5432:5432"
    volumes:
      - medeben-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medeben -d medeben"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medeben-pgdata:

# Local development only: PostgreSQL for the backend (profile dev).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: tedeben-postgres
    environment:
      POSTGRES_DB: tedeben
      POSTGRES_USER: tedeben
      POSTGRES_PASSWORD: tedeben
    ports:
      - "5432:5432"
    volumes:
      - tedeben-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tedeben -d tedeben"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tedeben-pgdata:
